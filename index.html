<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>มินิเกมที่ 1 - หาทางกลับบ้านในป่า</title>
    <style>
        /* =========================================================
           CSS STYLES
        ========================================================= */
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #17291d;
            font-family: Tahoma, "Noto Sans Thai", Arial, sans-serif;
        }

        #game {
            position: relative;
            width: 100vw;
            height: 56.25vw;
            max-width: 177.777777vh;
            max-height: 100vh;
            margin: auto;
            overflow: hidden;
            background-image: url("BG_mini1.png");
            background-repeat: no-repeat;
            background-position: center center;
            background-size: 100% 100%;
        }

        #startScreen {
            position: absolute;
            inset: 0;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.28);
        }

        .startBox {
            width: 42%;
            max-width: 720px;
            padding: 28px 35px;
            text-align: center;
            background: linear-gradient(#fff5d8, #f6d994);
            border: 5px solid #71341c;
            border-radius: 28px;
            box-shadow: 0 12px 35px rgba(0,0,0,.45);
        }

        .startBox h1 {
            margin: 0 0 10px;
            color: #692c15;
            font-size: clamp(26px, 2.8vw, 44px);
            line-height: 1.2;
            font-weight: 900;
        }

        .startBox p {
            margin: 6px 0;
            color: #71351d;
            font-size: clamp(22px, 1.5vw, 26px);
            line-height: 1.4;
            font-weight: 700;
        }

        .startButton, .actionBtn {
            margin-top: 10px;
            padding: 10px 32px;
            border: 4px solid #653019;
            border-radius: 20px;
            background: linear-gradient(#82c95c, #4e9139);
            color: white;
            font-size: clamp(18px, 1.4vw, 26px);
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 5px 0 #4c2918;
        }

        .startButton:hover, .actionBtn:hover {
            filter: brightness(1.08);
            transform: translateY(-2px);
        }

        #stoneCounter {
            position: absolute;
            z-index: 30;
            left: 55.0%;
            top: 7.8%;
            width: 27.8%;
            height: 10.5%;
            color: #672c16;
            text-align: center;
            font-size: clamp(15px, 1.25vw, 30px);
            font-weight: 900;
            pointer-events: none;
        }

        #bagStones {
            position: absolute;
            left: 4%;
            right: 4%;
            top: 45%;
            height: 60%;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: clamp(18px, 2vw, 18px);
        }

        .bagStone {
            position: relative;
            display: inline-block;
            width: clamp(16px, 1.2vw, 24px);
            height: clamp(14px, 1vw, 20px);
            border-radius: 45% 55% 50% 42%;
            background:
                radial-gradient(circle at 34% 28%, #ffffff 0 8%, #dffcff 9% 18%, transparent 19%),
                linear-gradient(135deg, #e9ffff 0%, #8cecff 32%, #38bde4 62%, #207baf 100%);
            border: 2px solid rgba(218,255,255,.95);
            box-shadow:
                0 0 5px rgba(170,248,255,.95),
                0 0 10px rgba(70,220,255,.85),
                0 0 16px rgba(45,190,255,.55);
            transform: rotate(-8deg);
            animation: stoneGlow 1.8s ease-in-out infinite alternate;
            line-height: 1;
            transition: opacity .25s, transform .25s;
        }

        .bagStone.hidden {
            opacity: 0;
            transform: scale(.2);
        }

        .bagStone::after {
            content: "";
            position: absolute;
            width: 30%;
            height: 20%;
            left: 20%;
            top: 18%;
            border-radius: 50%;
            background: rgba(255,255,255,.8);
            filter: blur(1px);
        }

        @keyframes stoneGlow {
            from {
                filter: brightness(.95);
                box-shadow: 0 0 5px rgba(170,248,255,.85), 0 0 10px rgba(70,220,255,.72);
            }
            to {
                filter: brightness(1.18);
                box-shadow: 0 0 7px rgba(220,255,255,1), 0 0 15px rgba(70,225,255,.95);
            }
        }

        #questionArea {
            position: absolute;
            z-index: 20;
            left: 49.0%;
            top: 22.0%;
            width: 34.5%;
            min-height: 56%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        #questionTitle {
            width: 100%;
            margin-bottom: 15px;
            color: #672b15;
            font-size: clamp(30px, 1.8vw, 30px);
            line-height: 1.25;
            font-weight: 900;
        }

        #questionText {
            width: 96%;
            color: #6a2e18;
            font-size: clamp(30px, 1.8vw, 30px);    
            line-height: 1.45;
            font-weight: 800;
        }

        #answers {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .answer {
            width: 100%;
            height: clamp(48px, 4.5vw, 68px);
            border: 3px solid #653019;
            border-radius: 15px;
            color: white;
            font-size: clamp(18px, 1.5vw, 28px);
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(75,35,17,.45);
            transition: transform .12s, filter .12s, opacity .2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .answer:nth-child(1) { background: #73c6df; }
        .answer:nth-child(2) { background: #f3b93b; }
        .answer:nth-child(3) { background: #78b451; }
        .answer:nth-child(4) { background: #e35b4d; }

        .answer:hover:not(:disabled) {
            transform: translateY(-3px);
            filter: brightness(1.08);
        }

        .answer:active:not(:disabled) {
            transform: translateY(2px);
        }

        .answer:disabled {
            cursor: default;
            opacity: 0.65;
        }

        .answer.selected-correct {
            opacity: 1 !important;
            filter: brightness(1.2);
            box-shadow: 0 0 15px #3d8c35, 0 4px 0 rgba(75,35,17,.45);
            border-color: #2b6125;
        }

        .answer.selected-wrong {
            opacity: 0.8 !important;
            background: #b83b2e !important;
            box-shadow: 0 0 10px #881a10, 0 4px 0 rgba(75,35,17,.45);
        }

        #feedback {
            width: 100%;
            min-height: 38px;
            margin-top: 10px;
            color: #71321b;
            font-size: clamp(14px, 1.2vw, 20px);
            line-height: 1.3;
            font-weight: 900;
        }

        #feedback.correct { color: #3d8c35; }
        #feedback.wrong { color: #b83b2e; }

        .navControls {
            display: flex;
            gap: 10px;
            margin-top: 0px;
        }

        .navBtn {
            padding: 10px 20px;
            border: 3px solid #653019;
            border-radius: 16px;
            color: white;
            font-size: clamp(14px, 1vw, 20px);
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 0 #5a2a17;
        }

        #prevButton {
            background: linear-gradient(#73c6df, #38bde4);
        }

        #nextButton {
            background: linear-gradient(#ffc55b, #e88b31);
        }

        #success {
            position: absolute;
            inset: 0;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(15,40,25,.58);
        }

        .successBox {
            width: 46%;
            max-width: 760px;
            padding: 28px;
            background: linear-gradient(#fff3cd, #ffd77d);
            border: 5px solid #6c3018;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 12px 35px rgba(0,0,0,.45);
        }

        .successEmoji { font-size: clamp(45px, 4vw, 75px); }
        .successBox h1 { margin: 5px; color: #682d16; font-size: clamp(26px, 2.3vw, 40px); }
        .successBox p { color: #71351d; font-size: clamp(16px, 1.3vw, 24px); line-height: 1.6; font-weight: 700; }

        .confetti {
            position: fixed;
            z-index: 2000;
            top: -30px;
            font-size: 22px;
            animation: confettiFall 2.8s linear forwards;
        }

        @keyframes confettiFall {
            to {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

<div id="game">

    <!-- START SCREEN -->
    <div id="startScreen">
        <div class="startBox">
            <h1>🌲 หาทางกลับบ้านในป่า 🌲</h1>
            <p id="welcomePlayerText" style="font-size: 1.4em; color: #4e9139; font-weight: bold;">กำลังโหลดข้อมูลผู้เล่น...</p>
            <p>ช่วยฮันเซลกับเกรเทล ตอบโจทย์คณิตศาสตร์</p>
            <p>สะสมก้อนหินเรืองแสงเพื่อนำทางกลับบ้าน</p>
            
            <button id="startBtn" class="startButton" onclick="startGame()">▶ เริ่มเกม</button>
        </div>
    </div>

    <!-- STONE COUNTER STATUS BAR -->
    <div id="stoneCounter">
        <div>ก้อนกรวดสะสม: <span id="stoneNumber">0</span>/10</div>
        <div id="bagStones">
            <span class="bagStone hidden"></span>
            <span class="bagStone hidden"></span>
            <span class="bagStone hidden"></span>
            <span class="bagStone hidden"></span>
            <span class="bagStone hidden"></span>
            <span class="bagStone hidden"></span>
            <span class="bagStone hidden"></span>
            <span class="bagStone hidden"></span>
            <span class="bagStone hidden"></span>
            <span class="bagStone hidden"></span>
        </div>
    </div>

    <!-- QUESTION AREA -->
    <div id="questionArea">
        <div id="questionTitle"></div>
        <div id="questionText"></div>
        <div id="answers"></div>
        <div id="feedback"></div>
        
        <div class="navControls">
            <button id="prevButton" class="navBtn" onclick="prevQuestion()" style="display:none;">
                ⭠
            </button>
            <button id="nextButton" class="navBtn" onclick="nextQuestion()" style="display:none;">
                ⭢
            </button>
        </div>
    </div>

    <!-- RESULT / SUMMARY POPUP -->
    <div id="success">
        <div class="successBox">
            <div class="successEmoji">🎉 ✨ 🏠</div>
            <h1 id="resultTitle">เก่งมาก!</h1>
            <p id="resultText">คุณสะสมก้อนหินเรืองแสงได้ครบแล้ว!</p>
            <div style="display: flex; justify-content: center; gap: 15px; margin-top: 15px;">
                <button class="actionBtn" onclick="startGame()">🔄 เล่นใหม่อีกครั้ง</button>
                <button class="actionBtn" id="nextChapterBtn" style="background: linear-gradient(#4a90e2, #21528b);" onclick="goToNextChapter()">📖 ไปยังบทที่ 2</button>
            </div>
        </div>
    </div>

</div>

<script type="module">
    // ==========================================
    // Firebase Import CDN
    // ==========================================
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";

    // ==========================================
    // Firebase Config
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyDKY05pVezUBqNpw23_csKgRKFMK5Ri3qk",
      authDomain: "talespark-5b3a3.firebaseapp.com",
      projectId: "talespark-5b3a3",
      storageBucket: "talespark-5b3a3.firebasestorage.app",
      messagingSenderId: "38618612317",
      appId: "1:38618612317:web:23cf7a95bf262f83c403b4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ==========================================
    // Player ID & Global Variables
    // ==========================================
    const urlParams = new URLSearchParams(window.location.search);
    const playerId = urlParams.get('id');

    let playerName = "ผู้เล่น";
    let currentQuestion = 0;
    let questionResults = new Array(10).fill(null);
    let userAnswers = new Array(10).fill(null);

    // DOM Elements
    let startScreen, welcomePlayerText, startBtn, questionTitle, questionText, answers, feedback, nextButton, prevButton, stoneNumber, bagStones, success, resultTitle, resultText;

    // ==========================================
    // Load Player Data from Firebase Logic
    // ==========================================
    async function loadPlayerData() {
      if (!playerId) {
        console.warn("⚠️ ไม่พบ Player ID ใน URL ใช้ชื่อเริ่มต้น:", playerName);
        if (welcomePlayerText) welcomePlayerText.textContent = `ยินดีต้อนรับ คุณ${playerName}`;
        return;
      }

      try {
        const playerRef = doc(db, "players", playerId);
        const playerSnap = await getDoc(playerRef);

        if (playerSnap.exists()) {
          const data = playerSnap.data();
          playerName = data.playerName || data.name || "ผู้เล่น";
          console.log("✅ ดึงข้อมูลผู้เล่นสำเร็จ:", playerName);
          
          if (welcomePlayerText) {
            welcomePlayerText.textContent = `ยินดีต้อนรับ คุณ${playerName}!`;
          }
        } else {
          console.error("❌ ไม่พบข้อมูลผู้เล่นใน Firestore สำหรับ ID:", playerId);
        }
      } catch (error) {
        console.error("🔥 เกิดข้อผิดพลาดในการดึงข้อมูลผู้เล่น:", error);
      }
    }

    // ==========================================
    // Save Score Function
    // ==========================================
    async function saveScore(score) {
      if (!playerId) {
        console.error("❌ ไม่พบ Player ID ใน URL ไม่สามารถบันทึกคะแนนได้");
        return;
      }

      try {
        const playerRef = doc(db, "players", playerId);
        await updateDoc(playerRef, {
          score: score,
          updatedAt: new Date()
        });
        console.log("✅ บันทึกคะแนนสำเร็จ:", score);
      } catch (error) {
        console.error("🔥 เกิดข้อผิดพลาดในการบันทึกคะแนน:", error);
      }
    }

    // ==========================================
    // Questions Data
    // ==========================================
    const questions = [
        { title: "--- ข้อที่ 1 / 10 --- ", text: "🍎🍎🍎🍎🍎<br><br>มีแอปเปิลกี่ลูก?", answers: ["4 (Four)", "5 (Five)", "6 (Six)", "7 (Seven)"], correctIndex: 1 },
        { title: "--- ข้อที่ 2 / 10 --- ", text: "🪨🪨🪨 + 🪨🪨<br><br>มีหินทั้งหมดกี่ก้อน?", answers: ["4 (Four)", "5 (Five)", "6 (Six)", "7 (Seven)"], correctIndex: 1 },
        { title: "--- ข้อที่ 3 / 10 --- ", text: "ฮันเซลมีลูกอม 5 เม็ด<br>เกรเทลให้เพิ่มอีก 3 เม็ด<br>ฮันเซลมีลูกอมทั้งหมดกี่เม็ด?", answers: ["6 (Six)", "7 (Seven)", "8 (Eight)", "9 (Nine)"], correctIndex: 2 },
        { title: "--- ข้อที่ 4 / 10 --- ", text: "7 + 6 = ?", answers: ["11 (Eleven)", "12 (Twelve)", "13 (Thirteen)", "14 (Fourteen)"], correctIndex: 2 },
        { title: "--- ข้อที่ 5 / 10 --- ", text: "ฮันเซลมีลูกอม 8 เม็ด<br>กินไป 3 เม็ด<br>เหลือกี่เม็ด?", answers: ["4 (Four)", "5 (Five)", "6 (Six)", "7 (Seven)"], correctIndex: 1 },
        { title: "--- ข้อที่ 6 / 10 --- ", text: "15 − 8 = ?", answers: ["6 (Six)", "7 (Seven)", "8 (Eight)", "9 (Nine)"], correctIndex: 1 },
        { title: "--- ข้อที่ 7 / 10 --- ", text: "เรียงก้อนหินจากน้อยไปมาก<br>4, 6, 8, __ ก้อน<br>จำนวนที่หายไปคือเท่าไร?", answers: ["8 (Eight)", "9 (Nine)", "10 (Ten)", "11 (Eleven)"], correctIndex: 2 },
        { title: "--- ข้อที่ 8 / 10 --- ", text: "🐦🐦🐦🐦🐦 มีนก 5 ตัว<br>และ 🦋🦋🦋 มีผีเสื้อ 3 ตัว<br>นกมากกว่าผีเสื้อกี่ตัว?", answers: ["1 (One)", "2 (Two)", "3 (Three)", "4 (Four)"], correctIndex: 1 },
        { title: "--- ข้อที่ 9 / 10 --- ", text: "มีหิน 7 ก้อน<br>เก็บเพิ่มอีก 5 ก้อน<br>ตอนนี้มีหินทั้งหมดกี่ก้อน?", answers: ["10 (Ten)", "11 (Eleven)", "12 (Twelve)", "13 (Thirteen)"], correctIndex: 2 },
        { title: "--- ข้อที่ 10 / 10 --- ", text: "🪨🪨🪨🪨🪨🪨🪨🪨<br>มีหิน 8 ก้อน แบ่งให้เด็ก 2 คนเท่า ๆ กัน แต่ละคนได้กี่ก้อน?", answers: ["2 (Two)", "3 (Three)", "4 (Four)", "5 (Five)"], correctIndex: 2 }
    ];

    // ==========================================
    // Initialization & Events
    // ==========================================
    window.addEventListener("DOMContentLoaded", async () => {
        startScreen = document.getElementById("startScreen");
        welcomePlayerText = document.getElementById("welcomePlayerText");
        startBtn = document.getElementById("startBtn");
        questionTitle = document.getElementById("questionTitle");
        questionText = document.getElementById("questionText");
        answers = document.getElementById("answers");
        feedback = document.getElementById("feedback");
        nextButton = document.getElementById("nextButton");
        prevButton = document.getElementById("prevButton");
        stoneNumber = document.getElementById("stoneNumber");
        bagStones = document.querySelectorAll(".bagStone");
        success = document.getElementById("success");
        resultTitle = document.getElementById("resultTitle");
        resultText = document.getElementById("resultText");

        updateStoneCounter();
        await loadPlayerData();
    });

    function startGame() {
        startScreen.style.display = "none";
        resetGame();
        showQuestion(0);
    }

    function resetGame() {
        currentQuestion = 0;
        questionResults = new Array(10).fill(null);
        userAnswers = new Array(10).fill(null);
        success.style.display = "none";
        updateStoneCounter();
    }

    function updateStoneCounter() {
        if (!stoneNumber) return;
        const stonesCollected = questionResults.filter(val => val === true).length;
        stoneNumber.textContent = stonesCollected;

        bagStones.forEach((stone, index) => {
            if (index < stonesCollected) {
                stone.classList.remove("hidden");
            } else {
                stone.classList.add("hidden");
            }
        });
    }

    function showQuestion(index) {
        currentQuestion = index;
        const question = questions[index];

        questionTitle.innerHTML = question.title;
        questionText.innerHTML = question.text;
        feedback.innerHTML = "";
        feedback.className = "";
        answers.innerHTML = "";

        if (prevButton) {
            prevButton.style.display = currentQuestion > 0 ? "block" : "none";
        }

        if (nextButton) {
            nextButton.style.display = questionResults[currentQuestion] !== null ? "block" : "none";
            nextButton.textContent = (currentQuestion === questions.length - 1) ? "ดูผลสรุป ➜" : "⭢";
        }

        question.answers.forEach((answerValue, choiceIndex) => {
            const button = document.createElement("button");
            button.className = "answer";
            button.textContent = answerValue;

            if (questionResults[currentQuestion] !== null) {
                button.disabled = true;
                if (choiceIndex === question.correctIndex) {
                    button.classList.add("selected-correct");
                } else if (choiceIndex === userAnswers[currentQuestion]) {
                    button.classList.add("selected-wrong");
                }
            } else {
                button.onclick = function() { checkAnswer(choiceIndex, button); };
            }
            
            answers.appendChild(button);
        });

        if (questionResults[currentQuestion] === true) {
            feedback.className = "correct";
            feedback.innerHTML = "🎉 ตอบถูกต้อง! ได้รับก้อนหินเรืองแสง 🪨";
        } else if (questionResults[currentQuestion] === false) {
            feedback.className = "wrong";
            feedback.innerHTML = "❌ ข้อนี้ตอบไม่ถูกต้อง";
        }
    }

    function checkAnswer(choiceIndex, clickedButton) {
        const question = questions[currentQuestion];
        userAnswers[currentQuestion] = choiceIndex;

        const buttons = answers.querySelectorAll(".answer");
        buttons.forEach(btn => btn.disabled = true);

        if (choiceIndex === question.correctIndex) {
            questionResults[currentQuestion] = true;
            clickedButton.classList.add("selected-correct");
            feedback.className = "correct";
            feedback.innerHTML = "🎉 ถูกต้อง! ได้รับก้อนหินเรืองแสง +1 🪨";
            updateStoneCounter();
        } else {
            questionResults[currentQuestion] = false;
            clickedButton.classList.add("selected-wrong");
            feedback.className = "wrong";
            feedback.innerHTML = "❌ ตอบไม่ถูกต้อง!";
        }

        if (nextButton) nextButton.style.display = "block";
    }

    function nextQuestion() {
        if (currentQuestion < questions.length - 1) {
            showQuestion(currentQuestion + 1);
        } else {
            showSuccess();
        }
    }

    function prevQuestion() {
        if (currentQuestion > 0) {
            showQuestion(currentQuestion - 1);
        }
    }

    function showSuccess() {
        const totalStones = questionResults.filter(val => val === true).length;
        
        if (resultTitle) {
            resultTitle.textContent = totalStones >= 7 ? `เก่งมากคุณ ${playerName}!` : `พยายามอีกนิดนะคุณ ${playerName}! `;
        }
        
        if (resultText) {
            resultText.innerHTML = `ผู้เล่น: <b>${playerName}</b><br>ตอบถูกทั้งหมด <b>${totalStones} / 10</b> ข้อ<br>สะสมก้อนหินเรืองแสงได้ <b>${totalStones}</b> ก้อน`;
        }

        success.style.display = "flex";
        createConfetti();
        saveScore(totalStones);
    }

    function createConfetti() {
        const items = ["🎉", "⭐", "✨", "🪨", "🍀"];
        for (let i = 0; i < 35; i++) {
            const item = document.createElement("div");
            item.className = "confetti";
            item.textContent = items[Math.floor(Math.random() * items.length)];
            item.style.left = Math.random() * 100 + "vw";
            item.style.animationDelay = Math.random() * 1.2 + "s";
            document.body.appendChild(item);
            setTimeout(() => item.remove(), 4000);
        }
    }

    function goToNextChapter() {
        if (playerId) {
            window.location.href = `Story_ch2.html?id=${playerId}`;
        } else {
            window.location.href = `Story_ch2.html`;
        }
    }

    // ผูกฟังก์ชันเข้ากับ window เพื่อให้ปุ่มเรียกใช้งานได้ปกติ
    window.startGame = startGame;
    window.resetGame = resetGame;
    window.nextQuestion = nextQuestion;
    window.prevQuestion = prevQuestion;
    window.goToNextChapter = goToNextChapter;
</script>

</body>
</html>
